# Site checks. See decisions/ADR-0009.
#
# Runs on every pull request into master and on master itself, so a red check
# shows up before merge (which deploys straight to GitHub Pages) and the last
# good state of master stays visible. Nothing here builds or deploys the site.
name: checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fast, dependency-free checks first, so a missing token or file fails in
      # seconds without waiting on a browser download.
      - name: CSS custom properties
        run: npm run lint:css

      - name: Links and assets
        run: npm run check:links

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:smoke

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
